services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:1414"
    env_file:
      - .env
    volumes:
      - .:/app

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "1414:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/app/media:ro
      - ./staticfiles:/app/staticfiles:ro
