services:
  - type: web
    name: madrugadao-car-sales
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn mrcards.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: madrugadao-db
          property: connectionString

databases:
  - name: madrugadao-db
    plan: free
